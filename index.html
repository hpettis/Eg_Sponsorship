<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Right Whale Sponsorship Updates</title>
<style>
  /* Helvetica Neue LT Std is a licensed typeface (Linotype/Monotype) - these @font-face rules
     point at local font files that need to be supplied and hosted alongside this page. Until
     those files are added, the fallback stacks below (Arial Narrow / Arial Black / Helvetica)
     approximate each weight so the page still renders sensibly. */
  @font-face {
    font-family: "HelveticaNeueLTStd-MdCn";
    src: url("fonts/HelveticaNeueLTStd-MdCn.woff2") format("woff2"),
         url("fonts/HelveticaNeueLTStd-MdCn.woff") format("woff");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "HelveticaNeueLTStd-Hv";
    src: url("fonts/HelveticaNeueLTStd-Hv.woff2") format("woff2"),
         url("fonts/HelveticaNeueLTStd-Hv.woff") format("woff");
    font-weight: 800;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "HelveticaNeueLTStd-Roman";
    src: url("fonts/HelveticaNeueLTStd-Roman.woff2") format("woff2"),
         url("fonts/HelveticaNeueLTStd-Roman.woff") format("woff");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --font-condensed: "HelveticaNeueLTStd-MdCn", "Arial Narrow", Arial, sans-serif;
    --font-alt-header: "HelveticaNeueLTStd-Hv", "Arial Black", Arial, sans-serif;
    --font-body: "HelveticaNeueLTStd-Roman", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  html, body { margin: 0; padding: 0; background: #f5f9fb; font-family: var(--font-body); font-size: 10pt; line-height: 14pt; color: #1c1c1a; }
  .site-header { width: 100%; background: #ffffff; border-bottom: 3px solid #0a3049; box-sizing: border-box; }
  .site-header-inner { max-width: 1080px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .org-logo { display: flex; align-items: center; }
  .org-logo img { display: block; height: 44px; width: auto; }
  .org-divider { width: 1px; height: 36px; background: #d8d6cc; }

  #wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 64px; }

  /* header */
  .page-header { max-width: 640px; margin: 0 0 40px; }
  .page-title { font-family: var(--font-alt-header); font-size: 34px; font-weight: 800; letter-spacing: 0.06em; line-height: 1.25; margin: 0 0 10px; color: #0a3049; }
  .page-subtitle { font-size: 15.5px; line-height: 1.6; color: #6b6a64; margin: 0; }

  .section-title { font-family: var(--font-condensed); font-size: 24px; font-weight: 500; color: #0a3049; margin: 0 0 4px; }
  .section-sub { font-size: 13.5px; color: #6b6a64; margin: 0 0 18px; }
  section.block { margin-bottom: 56px; }
  .map-section-wide { width: 100%; box-sizing: border-box; padding: 0 24px 56px; display: flex; justify-content: center; }
  .map-section-wide-inner { width: 100%; max-width: 1600px; }
  #primaryMap, #profileMapMount { width: 100%; }

  /* whale switcher */
  .whale-switcher { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; margin-bottom: 22px; scrollbar-width: thin; }
  .switcher-chip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid #d8d6cc; background: #ffffff; cursor: pointer; font-size: 13px; font-weight: 600; color: #33322e; white-space: nowrap; font-family: inherit; transition: background 0.1s ease, border-color 0.1s ease, color 0.1s ease; }
  .switcher-chip:hover { border-color: #0a3049; }
  .switcher-chip:focus-visible { outline: 2px solid #0a3049; outline-offset: 2px; }
  .switcher-chip.active { background: #0a3049; border-color: #0a3049; color: #ffffff; }
  .switcher-swatch { width: 13px; height: 13px; flex: none; }
  .switcher-star { color: #d3f0f6; font-size: 12px; line-height: 1; }
  .switcher-chip.active .switcher-star { color: #d3f0f6; }

  /* profile */
  .profile { display: flex; flex-direction: column; gap: 24px; background: #ffffff; border: 1.5px solid #d8d6cc; border-radius: 14px; padding: 26px 28px; }
  .profile-header { display: flex; gap: 18px; }
  .profile-photo { flex: 0 0 41%; aspect-ratio: 1 / 1; border-radius: 10px; background: repeating-linear-gradient(45deg, #f0efe9, #f0efe9 8px, #e7e5db 8px, #e7e5db 16px); border: 1px dashed #c9c7bc; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
  .profile-photo svg { opacity: 0.5; width: 40px; height: 40px; }
  .profile-photo span { font-size: 11.5px; color: #918f86; letter-spacing: 0.02em; text-align: center; padding: 0 6px; }
  .profile-details { flex: 1 1 auto; min-width: 0; }
  .profile-top { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; flex-wrap: wrap; }
  .profile-name { font-family: var(--font-condensed); font-size: 27px; font-weight: 500; color: #0a3049; }
  .profile-eg { font-size: 12px; color: #918f86; font-variant-numeric: tabular-nums; }
  .profile-badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: #0a3049; background: #d3f0f6; padding: 2px 8px; border-radius: 999px; }
  .profile-summary { font-size: 13.5px; color: #6b6a64; margin: 6px 0 14px; }
  .profile-fields { display: flex; flex-direction: column; gap: 8px; margin: 0 0 16px; }
  .profile-field { display: flex; align-items: baseline; gap: 6px; }
  .profile-field-label { flex: 0 0 78px; font-size: 12.5px; color: #6b6a64; font-weight: 600; }
  .profile-field-value { font-size: 13.5px; color: #1c1c1a; }
  .update-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #918f86; margin-bottom: 6px; }
  .update-box { border: 1.5px dashed #d8d6cc; border-radius: 10px; padding: 13px 15px; font-size: 13.5px; line-height: 1.65; color: #33322e; background: #fbfaf6; }

  .profile-map-col { width: 100%; padding-top: 22px; border-top: 1px solid #ece9df; }
  .profile-map-caption { font-size: 12.5px; font-weight: 600; color: #0a3049; margin-bottom: 8px; }

  .all-map-link-row { margin: -8px 0 22px; }
  .all-map-link { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: #0a3049; text-decoration: none; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
  .all-map-link svg { width: 13px; height: 13px; transition: transform 0.12s ease; }
  .all-map-link:hover svg { transform: translateX(3px); }

  @media (max-width: 420px) {
    .profile-header { flex-direction: column; }
    .profile-photo { flex: 0 0 auto; width: 100%; aspect-ratio: 16 / 9; }
  }

  /* maps (shared by profile mini-map and the full "all whales" map) */
  .map-sub { font-size: 13px; color: #6b6a64; margin: 0 0 16px; }
  .stage { position: relative; width: 100%; background: #eaf3fb; border: 0.5px solid #d8d6cc; border-radius: 10px; overflow: hidden; max-height: 82vh; }
  svg.map-svg { display: block; width: 100%; height: 100%; cursor: grab; }
  svg.map-svg:active { cursor: grabbing; }
  .land { fill: #ece8dd; stroke: #c9c4b4; stroke-width: 0.6; }
  .grat { fill: none; stroke: #c7ddef; stroke-width: 0.5; }
  .pt { cursor: pointer; stroke: #ffffff; stroke-width: 1; opacity: 0.88; }
  .pt.dim { opacity: 0.08; }
  .pt:hover { opacity: 1; stroke-width: 1.6; }
  .cluster-badge { cursor: pointer; }
  .cluster-badge circle { fill: #262521; fill-opacity: 0.85; stroke: #ffffff; stroke-width: 2; }
  .cluster-badge:hover circle { fill-opacity: 1; }
  .cluster-badge.active circle { fill: #1c1c1a; fill-opacity: 1; stroke: #00a9c9; stroke-width: 2.5; }
  .cluster-badge text { fill: #f5f4ee; font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

  .zoomctl { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 1px; background: #ffffff; border: 0.5px solid #d8d6cc; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
  .zoomctl button { width: 28px; height: 26px; border: none; background: #ffffff; color: #33322e; font-size: 15px; cursor: pointer; line-height: 1; }
  .zoomctl button:hover { background: #f0efe9; }
  .zoomctl button:first-child { border-bottom: 0.5px solid #e2e0d6; }

  .tooltip { position: absolute; pointer-events: none; background: #262521; color: #f5f4ee; font-size: 12.5px; padding: 6px 10px; border-radius: 6px; line-height: 1.5; opacity: 0; transition: opacity 0.08s; white-space: nowrap; z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .tooltip .tt-name { font-weight: 600; }
  .tooltip .tt-sub { color: #b9b7ac; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 14px 0 4px; }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #33322e; cursor: pointer; padding: 3px 8px 3px 6px; border-radius: 6px; border: 0.5px solid transparent; user-select: none; }
  .leg-item:hover { background: #ffffff; border-color: #d8d6cc; }
  .leg-item.off { opacity: 0.35; }
  .leg-swatch { width: 13px; height: 13px; flex: none; }
  .leg-count { color: #918f86; margin-left: 2px; }

  .hint { font-size: 12px; color: #918f86; margin-top: 8px; }

  .popout { position: absolute; width: 228px; background: #ffffff; border: 0.5px solid #d8d6cc; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); padding: 12px 14px 14px; z-index: 8; display: none; }
  .popout-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .popout-title { font-size: 13.5px; font-weight: 600; color: #1c1c1a; line-height: 1.35; }
  .popout-count { font-size: 11.5px; color: #6b6a64; margin: 2px 0 8px; }
  .popout-close { flex: none; background: none; border: none; cursor: pointer; color: #918f86; font-size: 17px; line-height: 1; padding: 0 0 0 4px; }
  .popout-close:hover { color: #1c1c1a; }
  .popout-whale-row { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #33322e; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; cursor: pointer; user-select: none; }
  .popout-whale-row:hover { background: #f5f4ee; }
  .popout-whale-row.off { opacity: 0.4; }
  .popout-swatch { width: 12px; height: 12px; flex: none; }
  .popout-wcount { margin-left: auto; color: #918f86; font-size: 11.5px; }
  .popout-btn { margin-top: 10px; width: 100%; padding: 7px; border-radius: 6px; border: 0.5px solid #d8d6cc; background: #f7f6f2; font-size: 12px; color: #33322e; cursor: pointer; }
  .popout-btn:hover { background: #eeece3; }
</style>
</head>

const whaleMeta = {"Manta": {"eg": 1507, "count": 37, "topRegion": "the Gulf of St. Lawrence", "update": "Manta has had an active season, turning up again and again in the Gulf of St. Lawrence's rich feeding grounds. Field teams spotted her skim-feeding in dense copepod patches through most of the summer, a good sign for her body condition heading into fall. She was also seen briefly off Cape Cod Bay early in the year, likely on her way north. No entanglement gear or new scarring was noted on any of her recent sightings. Researchers describe her as calm and predictable around survey vessels, making her one of the easier whales to track season to season. Your sponsorship continues to fund the aerial and vessel surveys that keep tabs on her movements."}, "Shackelton": {"eg": 2440, "count": 30, "topRegion": "Cape Cod Bay", "update": "Shackelton spent much of the year close to home in Cape Cod Bay, where he's become a familiar face to the local monitoring team. He was photographed several times feeding at the surface during the spring plankton bloom, tail flukes barely breaking the water. A short trip south to the Mid-Atlantic Bight in late winter suggests he may be exploring new wintering grounds. His overall body condition looks good, with no signs of recent vessel strikes or entanglement. The team is watching closely to see whether he returns to Cape Cod Bay again next season."}, "Aphrodite": {"eg": 1701, "count": 19, "topRegion": "the Gulf of St. Lawrence", "update": "Aphrodite split her time fairly evenly this year between the Gulf of St. Lawrence and Cape Cod Bay, following the food. She was seen socializing with several other whales in a surface active group in June, a behavior researchers always enjoy documenting. A single sighting near the Mid-Atlantic Bight in December hints she may be testing a new southern route. No health concerns were flagged during any of her sightings this year. Thanks to your support, the team was able to fund additional survey days that led to two of these confirmed sightings."}, "Boomerang": {"eg": 2503, "count": 14, "topRegion": "the Gulf of St. Lawrence", "update": "Boomerang has been a Gulf of St. Lawrence regular this year, showing up repeatedly in the same stretch of water east of Anticosti Island. A lone sighting near Jeffreys Ledge earlier in the season suggests he still checks in on old feeding spots from time to time. Photographs from recent encounters show healthy skin condition and no new scarring. The consistency of his sightings has made him one of the better-tracked whales in the catalog this year. Survey teams expect to be back in his usual waters again this fall."}, "Gemini": {"eg": 1150, "count": 5, "topRegion": "Cape Cod Bay", "update": "Gemini has kept a lower profile this year, with sightings concentrated in Cape Cod Bay and a couple of trips through the Great South Channel. Each sighting showed her in good body condition, moving steadily between known feeding areas. Right whales like Gemini can go stretches without being seen simply because they're spread across such a wide range of ocean, so a quiet year isn't necessarily a concerning one. The team will keep watching for her as survey coverage expands next season. Every reported sighting, however brief, helps build a more complete picture of where she spends her time."}, "Calvin": {"eg": 2223, "count": 4, "topRegion": "the Gulf of St. Lawrence", "update": "Calvin was seen exclusively in the Gulf of St. Lawrence this year, all within a fairly tight cluster east of Anticosti Island. That kind of site fidelity is useful for researchers, since it makes it easier to predict where survey teams might catch up with him again. No injuries or entanglement were noted in any of the recent photographs. The team is hopeful for more frequent sightings as monitoring effort in the Gulf continues to grow. We'll share an update as soon as Calvin turns up again."}, "Resolution": {"eg": 3532, "count": 4, "topRegion": "the Mid-Atlantic Bight", " const symbolSize = 64;
function symbolPath(shape, size) {
  const s = d3.symbol().size(size || symbolSize);
  switch (shape) {
    case "square": return s.type(d3.symbolSquare)();
    case "triangle": return s.type(d3.symbolTriangle)();
    case "diamond": return s.type(d3.symbolDiamond)();
    case "cross": return s.type(d3.symbolCross)();
    case "star": return s.type(d3.symbolStar)();
    case "wye": return s.type(d3.symbolWye)();
    default: return s.type(d3.symbolCircle)();
  }
}
function swatchMarkup(name) {
  return `<path d="${symbolPath(shapeOf[name])}" transform="scale(0.42)" fill="${colors[name]}" stroke="${colors[name]}" stroke-width="0.8"></path>`;
}

const FULL_EXTENT_BOUNDS = { type: "MultiPoint", coordinates: [[-80.6, 25.4], [-61.7, 50.7]] };
function makeProjection(w, h, bounds) {
  return d3.geoMercator().fitExtent([[22, 22], [w - 22, h - 22]], bounds || FULL_EXTENT_BOUNDS);
}
function whaleExtentBounds(name) {
  const pts = sightings.filter(d => d["Whale Name"] === name);
  const lons = pts.map(d => d.Longitude), lats = pts.map(d => d.Latitude);
  const minLon = Math.min(...lons), maxLon = Math.max(...lons);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const padLon = Math.max((maxLon - minLon) * 0.35, 0.6);
  const padLat = Math.max((maxLat - minLat) * 0.35, 0.6);
  return { type: "MultiPoint", coordinates: [[minLon - padLon, minLat - padLat], [maxLon + padLon, maxLat + padLat]] };
}

const PRIMARY_W = 680, PRIMARY_H = 880;
const MINI_W = 760, MINI_H = 460;

let landFeatures = null;

// ---------- reusable map factory ----------
function mountMap(parent, opts) {
  const { data, showClusters, showLegend, hintText } = opts;
  let width = opts.width, height = opts.height;
  let extentBounds = opts.extentBounds || FULL_EXTENT_BOUNDS;
  let scaleMin = opts.scaleMin || 1;
  let projection = makeProjection(width, height, extentBounds);
  let path = d3.geoPath(projection);

  const stage = parent.append("div").attr("class", "stage").style("aspect-ratio", `${width} / ${height}`);
  const svg = stage.append("svg").attr("class", "map-svg").attr("viewBox", `0 0 ${width} ${height}`);
  const zoomctl = stage.append("div").attr("class", "zoomctl");
  const zoomInBtn = zoomctl.append("button").attr("aria-label", "Zoom in").text("+");
  const zoomOutBtn = zoomctl.append("button").attr("aria-label", "Zoom out").html("&minus;");
  const tooltip = stage.append("div").attr("class", "tooltip");
  const popoutEl = showClusters ? stage.append("div").attr("class", "popout") : null;

  const legend = showLegend ? parent.append("div").attr("class", "legend") : null;
  if (hintText) parent.append("p").attr("class", "hint").html(hintText);

  const gRoot = svg.append("g");
  const gLand = gRoot.append("g");
  const gGrat = gRoot.append("g");
  const gPts = svg.append("g");
  const gClusters = showClusters ? svg.append("g") : null;

  svg.insert("rect", ":first-child").attr("width", width).attr("height", height).attr("fill", "transparent");

  const graticule = d3.geoGraticule().step([5, 5]);
  gGrat.append("path").datum(graticule).attr("class", "grat").attr("d", path);

  const stageNode = stage.node();
  let activeWhale = null;
  let openCluster = null;
  let currentTransform = d3.zoomIdentity;

  function pointTransform(d) {
    const p = projection([d.Longitude, d.Latitude]);
    if (!p) return null;
    const [x, y] = currentTransform.apply(p);
    return `translate(${x},${y})`;
  }
  function clusterTransform(c) {
    const p = projection(c.centroid);
    if (!p) return null;
    const [x, y] = currentTransform.apply(p);
    return `translate(${x},${y})`;
  }

  function drawPoints() {
    gPts.selectAll("path.pt")
      .data(data)
      .join("path")
      .attr("class", "pt")
      .attr("d", d => symbolPath(shapeOf[d["Whale Name"]], sizeOf[d["Whale Name"]]))
      .attr("transform", pointTransform)
      .attr("fill", d => colors[d["Whale Name"]])
      .attr("stroke", "#ffffff")
      .attr("stroke-width", d => d["Whale Name"] === "Resolution" ? 1.6 : 1)
      .on("mouseenter", (event, d) => {
        const [x, y] = d3.pointer(event, stageNode);
        tooltip.html(`<div class="tt-name">${d["Whale Name"]}</div><div class="tt-sub">Eg #${d.SightingEGNo}</div>`)
          .style("left", (x + 14) + "px").style("top", (y - 10) + "px").style("opacity", 1);
      })
      .on("mousemove", (event) => {
        const [x, y] = d3.pointer(event, stageNode);
        tooltip.style("left", (x + 14) + "px").style("top", (y - 10) + "px");
      })
      .on("mouseleave", () => tooltip.style("opacity", 0));
    applyFilter();
  }

  function drawClusters() {
    const badge = gClusters.selectAll("g.cluster-badge")
      .data(clusters, d => d.code)
      .join("g")
      .attr("class", "cluster-badge")
      .attr("transform", clusterTransform)
      .on("click", (event, d) => { event.stopPropagation(); togglePopout(d); });
    badge.append("circle").attr("r", 13);
    badge.append("text").text(d => d.count);
  }

  function applyFilter() {
    gPts.selectAll("path.pt").classed("dim", d => activeWhale && d["Whale Name"] !== activeWhale);
  }

  function syncWhaleFilterUI() {
    applyFilter();
    if (legend) {
      legend.selectAll(".leg-item").classed("off", function () {
        const n = d3.select(this).attr("data-name");
        return activeWhale && n !== activeWhale;
      });
    }
    if (openCluster && popoutEl) {
      popoutEl.selectAll(".popout-whale-row").classed("off", function () {
        const n = d3.select(this).attr("data-name");
        return activeWhale && n !== activeWhale;
      });
    }
  }

  function screenPos(lonLat) {
    const p = projection(lonLat);
    const [tx, ty] = currentTransform.apply(p);
    const scaleFactor = stageNode.clientWidth / width;
    return [tx * scaleFactor, ty * scaleFactor];
  }

  function positionPopout() {
    if (!openCluster || !popoutEl) return;
    const [sx, sy] = screenPos(openCluster.centroid);
    const boxW = 228;
    const boxH = popoutEl.node().offsetHeight || 200;
    let left = sx + 20;
    const maxLeft = stageNode.clientWidth - boxW - 8;
    if (left > maxLeft) left = sx - boxW - 20;
    left = Math.max(8, Math.min(left, maxLeft));
    let top = Math.max(8, Math.min(sy - boxH / 2, stageNode.clientHeight - boxH - 8));
    popoutEl.style("left", left + "px").style("top", top + "px");
  }

  function renderPopoutContent(c) {
    const rows = Object.entries(c.whales).map(([name, count]) => {
      const off = activeWhale && activeWhale !== name ? " off" : "";
      return `<div class="popout-whale-row${off}" data-name="${name}">

        <span>${name}</span>
        <span class="popout-wcount">${count}</span>

    }).join("");
    popoutEl.html(`
      <div class="popout-head">
        <div>
          <div class="popout-title">${c.label}</div>
          <div class="popout-count">${c.count} sightings</div>
        </div>

      </div>

      <button class="popout-btn">Zoom to this cluster</button>
    `);
    popoutEl.select(".popout-close").on("click", (event) => { event.stopPropagation(); closePopout(); });
    popoutEl.select(".popout-btn").on("click", (event) => { event.stopPropagation(); zoomToBBox(c.bbox); });

      const name = d3.select(this).attr("data-name");
      activeWhale = activeWhale === name ? null : name;
      syncWhaleFilterUI();

    if (openCluster && openCluster.code === c.code) { closePopout(); return; }
    openCluster = c;
    gClusters.selectAll("g.cluster-badge").classed("active", d => d.code === c.code);
    renderPopoutContent(c);
    popoutEl.style("display", "block");
    positionPopout();
  }

  function closePopout() {
    openCluster = null;
    if (gClusters) gClusters.selectAll("g.cluster-badge").classed("active", false);
    if (popoutEl) popoutEl.style("display", "none");
  }

  function zoomToBBox(bbox) {
    const [lon0, lat0, lon1, lat1] = bbox;
    const p0 = projection([lon0, lat1]);
    const p1 = projection([lon1, lat0]);
    const dx = Math.max(30, p1[0] - p0[0]);
    const dy = Math.max(30, p1[1] - p0[1]);
    const cx = (p0[0] + p1[0]) / 2, cy = (p0[1] + p1[1]) / 2;
    const scale = Math.max(scaleMin, Math.min(10, 0.8 / Math.max(dx / width, dy / height)));
    const tx = width / 2 - scale * cx;
    const ty = height / 2 - scale * cy;
    svg.transition().duration(650).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }

  const zoom = d3.zoom()
    .scaleExtent([scaleMin, 10])
    .translateExtent([[-width * 0.12, -height * 0.12], [width * 1.12, height * 1.12]])
    .on("zoom", (event) => {
      currentTransform = event.transform;
      gRoot.attr("transform", currentTransform);
      gLand.attr("stroke-width", 0.6 / currentTransform.k);
      gGrat.attr("stroke-width", 0.5 / currentTransform.k);
      gPts.selectAll("path.pt").attr("transform", pointTransform);
      if (gClusters) gClusters.selectAll("g.cluster-badge").attr("transform", clusterTransform);
      positionPopout();
    });

  svg.call(zoom);
  svg.select("rect").on("click", () => closePopout());
  zoomInBtn.on("click", () => svg.transition().duration(200).call(zoom.scaleBy, 1.6));
  zoomOutBtn.on("click", () => svg.transition().duration(200).call(zoom.scaleBy, 0.625));

  if (landFeatures) {
    gLand.selectAll("path").data(landFeatures).join("path").attr("class", "land").attr("d", path);
  }
  if (showClusters) drawClusters();
  drawPoints();

  if (legend) {
    const counts = {};
    data.forEach(d => { counts[d["Whale Name"]] = (counts[d["Whale Name"]] || 0) + 1; });
    whaleOrder.forEach(name => {
      if (!counts[name]) return;
      const item = legend.append("div").attr("class", "leg-item").on("click", function () {
        activeWhale = activeWhale === name ? null : name;
        syncWhaleFilterUI();
      }).attr("data-name", name);
      item.append("svg").attr("class", "leg-swatch").attr("viewBox", "-6 -6 12 12").html(swatchMarkup(name));
      item.append("span").text(name);
      item.append("span").attr("class", "leg-count").text(`(${counts[name]})`);
    });
  }

  return {
    focusWhale: (name) => {
      activeWhale = name;
      syncWhaleFilterUI();
      const whalePoints = data.filter(d => d["Whale Name"] === name);
      if (!whalePoints.length) return;
      const lons = whalePoints.map(d => d.Longitude), lats = whalePoints.map(d => d.Latitude);
      zoomToBBox([Math.min(...lons), Math.min(...lats), Math.max(...lons), Math.max(...lats)]);
    },
    reset: () => {
      activeWhale = null;
      closePopout();
      syncWhaleFilterUI();
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    }
  };
}

// ---------- whale switcher + profile ----------
const whaleSwitcher = document.getElementById("whaleSwitcher");
const whaleProfile = document.getElementById("whaleProfile");
let activeWhale = null;

document.getElementById("allMapLink").addEventListener("click", () => {
  document.getElementById("allMapSection").scrollIntoView({ behavior: "smooth", block: "start" });
});

// Populate with the current visitor's sponsored whale name(s) - e.g. ["Resolution"] - to
// float those chips to the front of the switcher, ahead of the alphabetical ordering below,
// and to select that whale's profile by default on page load.
const mySponsoredWhales = [];
const whaleDisplayOrder = [
  ...mySponsoredWhales.filter(n => whaleOrder.includes(n)),
  ...[...whaleOrder].sort((a, b) => a.localeCompare(b)).filter(n => !mySponsoredWhales.includes(n))
];

whaleDisplayOrder.forEach(name => {
  const isMine = mySponsoredWhales.includes(name);
  const chip = document.createElement("button");
  chip.type = "button";
  chip.className = "switcher-chip";
  chip.dataset.name = name;
  chip.innerHTML = `
    <svg class="switcher-swatch" viewBox="-6 -6 12 12">${swatchMarkup(name)}</svg>
    <span>${name}</span>
    ${isMine ? '<span class="switcher-star">&#9733;</span>' : ""}
  `;
  chip.addEventListener("click", () => selectWhale(name));
  whaleSwitcher.appendChild(chip);
});

function setActiveChip(name) {
  whaleSwitcher.querySelectorAll(".switcher-chip").forEach(el => {
    el.classList.toggle("active", el.dataset.name === name);
  });
}

function selectWhale(name) {
  activeWhale = name;
  setActiveChip(name);
  renderProfile(name);
}

function renderProfile(name) {
  const m = whaleMeta[name];
  const bio = whaleBio[name];
  const isMine = mySponsoredWhales.includes(name);
  whaleProfile.innerHTML = `
    <div class="profile-header">
      <div class="profile-photo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="4.5" width="19" height="15" rx="2"></rect>
          <circle cx="8" cy="10" r="1.6"></circle>
          <path d="M2.5 16l5-5 4.5 4.5L17 10l4.5 5.5"></path>
        </svg>
        <span>Photo placeholder</span>
      </div>
      <div class="profile-details">
        <div class="profile-top">
          <svg class="switcher-swatch" width="18" height="18" viewBox="-6 -6 12 12">${swatchMarkup(name)}</svg>
          <div class="profile-name">${name}</div>
          <span class="profile-eg">Eg #${m.eg}</span>
          ${isMine ? '<span class="profile-badge">Your whale</span>' : ""}
        </div>
        <div class="profile-summary">${m.count} sightings, mostly in ${m.topRegion}</div>
        <div class="profile-fields">
          <div class="profile-field"><span class="profile-field-label">Birth Year:</span><span class="profile-field-value">${bio.birthYear}</span></div>
          <div class="profile-field"><span class="profile-field-label">Sex:</span><span class="profile-field-value">${bio.sex}</span></div>
          <div class="profile-field"><span class="profile-field-label">Age:</span><span class="profile-field-value">${bio.age}</span></div>
        </div>
        <div class="update-label">Update</div>
        <div class="update-box">${m.update}</div>
      </div>
    </div>
    <div class="profile-map-col">
      <div class="profile-map-caption">Where ${name} has been sighted</div>
      <div id="profileMapMount"></div>
    </div>
  `;

  if (landFeatures) mountProfileMap(name);
}

function mountProfileMap(name) {
  const mount = d3.select("#profileMapMount");
  mount.html("");
  const data = sightings.filter(d => d["Whale Name"] === name);
  mountMap(mount, {
    data,
    width: MINI_W, height: MINI_H,
    extentBounds: whaleExtentBounds(name),
    scaleMin: 0.6,
    showClusters: false, showLegend: false,
    hintText: "Scroll to zoom, drag to pan, hover a point for details."
  });
}

// ---------- build maps once land data is loaded ----------
let primaryMapApi = null;
d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json").then(world => {
  const land = topojson.feature(world, world.objects.land);
  landFeatures = land.features;

  const defaultWhale = mySponsoredWhales[0] || whaleDisplayOrder[0];
  selectWhale(defaultWhale);

  primaryMapApi = mountMap(d3.select("#primaryMap"), {
    data: sightings,
    width: PRIMARY_W, height: PRIMARY_H,
    showClusters: true, showLegend: true,
    hintText: "Scroll or use the buttons to zoom, drag to pan &middot; click a numbered cluster for details &middot; hover a point for whale info &middot; click a name below to isolate that whale"
  });
});
</script>
